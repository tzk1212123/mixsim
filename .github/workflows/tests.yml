name: Tests

# Run after a push, a pull request, or a manual start in GitHub Actions.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the project and pytest
        run: python -m pip install -e ".[dev]"

      - name: Run the six introductory tests
        run: python -m pytest test/test_rig.py -v
