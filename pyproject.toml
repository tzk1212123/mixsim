[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixsim"
version = "0.1.1"
description = "Reproducible two-pump color mixing simulator with shared safety and MCP control"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
mixsim = "mixsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mixsim = ["static/*", "references/*.md"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

